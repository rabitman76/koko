<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두근두근 이름 궁합 테스트</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Inter 및 둥근모꼴 느낌의 Pretendard) -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" rel="stylesheet">
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 3s infinite ease-in-out;
        }
        .heart-float {
            animation: float 2.5s infinite ease-in-out alternate;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-400 via-purple-500 to-indigo-600 min-h-screen flex flex-col items-center justify-center p-4 text-gray-800">

    <!-- 메인 컨테이너 카드 -->
    <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-6 sm:p-10 w-full max-w-lg border border-white/40 transform transition-all">
        
        <!-- 타이틀 섹션 -->
        <div class="text-center mb-8">
            <div class="inline-block bg-pink-100 text-pink-500 rounded-full p-3 mb-3 heart-float shadow-inner">
                <i class="fa-solid fa-heart text-3xl"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-600">
                운명의 이름 궁합
            </h1>
            <p class="text-sm sm:text-base text-gray-500 mt-2">두 분의 이름을 입력하고 짜릿한 궁합을 확인해보세요!</p>
        </div>

        <!-- 입력 섹션 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <!-- 첫 번째 이름 -->
            <div class="relative">
                <label class="block text-xs font-semibold text-gray-600 mb-1 ml-1 uppercase tracking-wider">첫 번째 분 이름</label>
                <div class="flex items-center bg-gray-50 rounded-2xl border-2 border-gray-200 focus-within:border-pink-500 transition-all px-4 py-3">
                    <i class="fa-solid fa-user text-pink-400 mr-3"></i>
                    <input type="text" id="name1" placeholder="예: 홍길동" maxlength="5"
                           class="w-full bg-transparent outline-none text-gray-700 font-medium placeholder-gray-400">
                </div>
            </div>

            <!-- 두 번째 이름 -->
            <div class="relative">
                <label class="block text-xs font-semibold text-gray-600 mb-1 ml-1 uppercase tracking-wider">두 번째 분 이름</label>
                <div class="flex items-center bg-gray-50 rounded-2xl border-2 border-gray-200 focus-within:border-pink-500 transition-all px-4 py-3">
                    <i class="fa-solid fa-user-heart text-purple-400 mr-3"></i>
                    <input type="text" id="name2" placeholder="예: 성춘향" maxlength="5"
                           class="w-full bg-transparent outline-none text-gray-700 font-medium placeholder-gray-400">
                </div>
            </div>
        </div>

        <!-- 궁합 보기 버튼 -->
        <button onclick="calculateCompatibility()" 
                class="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-pink-500/30 hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center space-x-2 text-lg">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>궁합 보기 ✨</span>
        </button>

        <!-- 로딩 애니메이션 (숨김 처리) -->
        <div id="loading" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-pink-400 border-t-transparent mb-4"></div>
            <p class="text-purple-600 font-semibold animate-pulse">두 분의 케미를 분석하고 있습니다...</p>
        </div>

        <!-- 결과 출력 영역 (숨김 처리) -->
        <div id="result-box" class="hidden mt-8 pt-6 border-t border-gray-100 text-center transition-all duration-500">
            <div class="text-sm font-semibold text-gray-400 mb-2">분석 완료 💕</div>
            
            <!-- 점수 표시기 -->
            <div class="relative inline-flex items-center justify-center my-2">
                <div class="text-6xl sm:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-purple-600" id="score-text">
                    0%
                </div>
            </div>

            <!-- 요약 해설 뱃지 -->
            <div id="result-title" class="text-lg font-bold text-gray-800 mt-2 mb-4 bg-pink-50 py-2 px-4 rounded-xl inline-block text-pink-600 border border-pink-100">
                <!-- 동적 타이틀 -->
            </div>

            <!-- 상세 해설 카드 -->
            <div class="bg-gradient-to-br from-purple-50 to-pink-50 rounded-2xl p-4 text-left border border-purple-100 shadow-sm">
                <div class="flex items-center mb-2 text-purple-700 font-bold text-sm">
                    <i class="fa-solid fa-book-open-reader mr-2"></i> 궁합 해설 리포트
                </div>
                <p id="result-desc" class="text-sm text-gray-600 leading-relaxed">
                    <!-- 동적 해설 내용 -->
                </p>
            </div>

            <!-- 다시하기 버튼 -->
            <button onclick="resetForm()" class="mt-6 text-sm text-gray-400 hover:text-gray-600 underline transition-colors">
                다시 입력하기
            </button>
        </div>
    </div>

    <!-- 푸터 -->
    <footer class="mt-8 text-white/80 text-xs text-center font-light">
        &copy; 2026 이름 궁합 연구소. All rights reserved.
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        // 한글 획수 데이터 매핑 (초성, 중성, 종성 기준 획수 계산용)
        const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
        const JUNG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
        const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        // 각 획수 정의 (단순화된 한글 획수 매핑 테이블)
        const choStrokes = { 'ㄱ':2, 'ㄲ':4, 'ㄴ':2, 'ㄷ':3, 'ㄸ':6, 'ㄹ':5, 'ㅁ':4, 'ㅂ':4, 'ㅃ':8, 'ㅅ':2, 'ㅆ':4, 'ㅇ':1, 'ㅈ':3, 'ㅉ':6, 'ㅊ':4, 'ㅋ':3, 'ㅌ':4, 'ㅍ':4, 'ㅎ':3 };
        const jungStrokes = { 'ㅏ':2, 'ㅐ':3, 'ㅑ':3, 'ㅒ':4, 'ㅓ':2, 'ㅔ':3, 'ㅕ':3, 'ㅖ':4, 'ㅗ':3, 'ㅘ':5, 'ㅙ':6, 'ㅚ':4, 'ㅛ':4, 'ㅜ':3, 'ㅝ':5, 'ㅞ':6, 'ㅟ':4, 'ㅠ':4, 'ㅡ':1, 'ㅢ':2, 'ㅣ':1 };
        const jongStrokes = { '':0, 'ㄱ':2, 'ㄲ':4, 'ㄳ':4, 'ㄴ':2, 'ㄵ':5, 'ㄶ':5, 'ㄷ':3, 'ㄹ':5, 'ㄺ':7, 'ㄻ':9, 'ㄼ':9, 'ㄽ':7, 'ㄾ':9, 'ㄿ':9, 'ㅀ':8, 'ㅁ':4, 'ㅂ':4, 'ㅄ':6, 'ㅅ':2, 'ㅆ':4, 'ㅇ':1, 'ㅈ':3, 'ㅊ':4, 'ㅋ':3, 'ㅌ':4, 'ㅍ':4, 'ㅎ':3 };

        function getCharStrokes(char) {
            const code = char.charCodeAt(0);
            // 한글 유니코드 범위 (가 ~ 힣)
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const base = code - 0xAC00;
                const jongIdx = base % 28;
                const jungIdx = Math.floor((base / 28) % 21);
                const choIdx = Math.floor(base / 28 / 21);

                const c = CHO[choIdx];
                const j = JUNG[jungIdx];
                const g = JONG[jongIdx];

                return (choStrokes[c] || 1) + (jungStrokes[j] || 1) + (jongStrokes[g] || 0);
            }
            // 한글이 아닐 경우 기본 값 부여
            return 5;
        }

        function calculateNameScore(name1, name2) {
            let combined = "";
            const maxLength = Math.max(name1.length, name2.length);
            
            // 이름 번갈아가며 합치기 (전통적인 방식)
            for (let i = 0; i < maxLength; i++) {
                if (i < name1.length) combined += name1[i];
                if (i < name2.length) combined += name2[i];
            }

            // 획수 배열로 변환
            let strokes = [];
            for (let i = 0; i < combined.length; i++) {
                strokes.push(getCharStrokes(combined[i]));
            }

            // 두 자리 숫자가 될 때까지 더하기 반복
            while (strokes.length > 2) {
                let temp = [];
                for (let i = 0; i < strokes.length - 1; i++) {
                    temp.push((strokes[i] + strokes[i+1]) % 10);
                }
                strokes = temp;
            }

            let score = strokes[0] * 10 + strokes[1];
            // 10점 미만일 경우 보정 혹은 50~99 사이로 맞추는 로직 적용 가능하나 재미를 위해 그대로 유지하되 너무 낮으면 보정
            if (score < 30) score += 40;
            if (score > 100) score = 99;
            return score;
        }

        function getCommentary(score) {
            if (score >= 90) {
                return {
                    title: "💍 천생연분! 로열 커플",
                    desc: "눈빛만 봐도 마음을 읽을 수 있는 완벽한 사이입니다! 서로에게 엄청난 시너지를 주며 평생을 함께해도 좋을 만큼 최고의 궁합이에요."
                };
            } else if (score >= 75) {
                return {
                    title: "💖 불타오르는 케미스트리",
                    desc: "서로에게 푹 빠져 헤어나올 수 없는 매력을 느끼고 있군요! 약간의 의견 차이가 있겠지만 사랑의 힘으로 충분히 극복할 수 있어요."
                };
            } else if (score >= 60) {
                return {
                    title: "😊 알콩달콩 보통의 연인",
                    desc: "서로를 알아가는 재미가 쏠쏠한 단계입니다. 배려와 존중을 조금만 더 더한다면 훨씬 더 깊은 관계로 발전할 수 있어요!"
                };
            } else if (score >= 40) {
                return {
                    title: "🧊 티격태격 썸과 현실 사이",
                    desc: "자주 부딪히지만 그만큼 서로에게 관심이 많다는 증거예요! 상대방의 입장에서 한 번 더 생각해보는 여유를 가져보세요."
                };
            } else {
                return {
                    title: "⚡ 개성 만점 반전 궁합",
                    desc: "처음에는 서로 너무 달라서 당황할 수 있지만, 반대이기 때문에 오히려 강력하게 끌릴 수 있는 잠재력이 숨어있답니다!"
                };
            }
        }

        function calculateCompatibility() {
            const name1 = document.getElementById('name1').value.trim();
            const name2 = document.getElementById('name2').value.trim();

            if (!name1 || !name2) {
                alert("두 분의 이름을 모두 입력해주세요! ✨");
                return;
            }

            // UI 상태 변경 (로딩 표시)
            const loadingEl = document.getElementById('loading');
            const resultBox = document.getElementById('result-box');
            
            resultBox.classList.add('hidden');
            loadingEl.classList.remove('hidden');

            setTimeout(() => {
                loadingEl.classList.add('hidden');
                
                const score = calculateNameScore(name1, name2);
                const info = getCommentary(score);

                document.getElementById('score-text').innerText = score + "%";
                document.getElementById('result-title').innerText = info.title;
                document.getElementById('result-desc').innerText = info.desc;

                resultBox.classList.remove('hidden');
            }, 1000); // 1초간 로딩 효과
        }

        function resetForm() {
            document.getElementById('name1').value = '';
            document.getElementById('name2').value = '';
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('name1').focus();
        }
    </script>
</body>
</html>
